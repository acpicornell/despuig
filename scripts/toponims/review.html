<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Revisió de topònims · Mapa Despuig</title>
<style>
  :root { --ink:#2b2117; --paper:#f3ead6; --line:#c9b78f; --accent:#8a3324; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; color:var(--ink); background:var(--paper); display:flex; height:100vh; overflow:hidden; }
  #side { width:220px; flex:none; border-right:2px solid var(--line); display:flex; flex-direction:column; background:#ece0c4; }
  #side h1 { font-size:1rem; margin:0; padding:.7rem; border-bottom:1px solid var(--line); }
  #grid { display:grid; grid-template-columns:repeat(13,1fr); gap:1px; padding:6px; }
  .cell { aspect-ratio:1; font-size:8px; border:1px solid var(--line); background:#ddd; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#444; }
  .cell.has { background:#e8a13a; color:#fff; }
  .cell.rev { background:#3a9d3a; color:#fff; }
  .cell.empty { background:#e7ddc6; color:#aaa; }
  .cell.cur { outline:3px solid var(--accent); outline-offset:-1px; }
  #side .stat { padding:.5rem .7rem; font-size:.8rem; border-top:1px solid var(--line); }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #bar { padding:.5rem .8rem; border-bottom:1px solid var(--line); display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; background:#ece0c4; }
  #bar button, #bar .lbl { font-size:.85rem; padding:.35rem .7rem; border:1px solid var(--line); background:#fff; border-radius:3px; cursor:pointer; }
  #bar button.primary { background:var(--accent); color:#fff; border-color:#6c281d; }
  #bar button.on { background:#3a9d3a; color:#fff; }
  #stage { flex:1; overflow:auto; position:relative; background:#777; display:flex; align-items:flex-start; justify-content:center; }
  #wrap { position:relative; margin:10px; }
  #wrap img { display:block; max-width:100%; }
  #wrap.add { cursor:crosshair; }
  .mk { position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%; border:2px solid #fff; background:#e8a13a; cursor:grab; box-shadow:0 0 0 1px #0006; }
  .mk.segur { background:#3a9d3a; }
  .mk.sel { outline:3px solid var(--accent); z-index:5; }
  #edit { position:absolute; right:10px; top:10px; width:260px; background:#fff; border:1px solid var(--line); border-radius:5px; padding:.7rem; box-shadow:0 4px 16px #0005; display:none; }
  #edit.show { display:block; }
  #edit label { display:block; font-size:.72rem; text-transform:uppercase; color:#777; margin:.5rem 0 .15rem; }
  #edit input[type=text], #edit select { width:100%; padding:.35rem; border:1px solid var(--line); border-radius:3px; font-size:.95rem; }
  #edit .row { display:flex; align-items:center; gap:.4rem; margin-top:.6rem; }
  #edit .del { color:var(--accent); cursor:pointer; font-size:.85rem; }
  .hint { font-size:.8rem; color:#666; }
</style>
</head>
<body>
  <div id="side">
    <h1>Cel·les</h1>
    <div id="grid"></div>
    <div class="stat" id="legend">
      <span style="color:#3a9d3a">█</span> revisada
      <span style="color:#e8a13a">█</span> pendent
      <span style="color:#bbb">█</span> buida
    </div>
    <div class="stat" id="totals"></div>
  </div>

  <div id="main">
    <div id="bar">
      <button id="prev">‹ anterior</button>
      <span class="lbl" id="cellid">—</span>
      <button id="next">següent ›</button>
      <button id="addbtn">+ afegeix punt</button>
      <button id="save" class="primary">desa cel·la</button>
      <span class="hint" id="msg"></span>
    </div>
    <div id="stage">
      <div id="wrap">
        <img id="tile" alt="tessel·la" />
        <div id="edit">
          <label>Nom (normalitzat)</label><input id="f_nom" type="text" />
          <label>Grafia original</label><input id="f_graf" type="text" />
          <label>Tipus</label>
          <select id="f_tipus">
            <option>possessió</option><option>nucli</option><option>hidrònim</option>
            <option>orònim</option><option>costa</option><option>altre</option>
          </select>
          <div class="row"><input id="f_dubte" type="checkbox" /> <span>dubte (lectura incerta)</span></div>
          <div class="row"><span class="del" id="f_del">🗑 esborra aquest punt</span></div>
        </div>
      </div>
    </div>
  </div>

<script>
const API = '';
let manifest, cells = {}, cur = null, data = null, sel = -1, addMode = false;
const $ = (id) => document.getElementById(id);

async function init() {
  manifest = await (await fetch('/api/manifest')).json();
  await refreshProgress();
  buildGrid();
  loadCell(manifest.cells[0].id);
}

async function refreshProgress() {
  cells = await (await fetch('/api/progress')).json();
  let rev = 0, tot = 0;
  for (const k in cells) { tot += cells[k].n; if (cells[k].revisat) rev++; }
  $('totals').textContent = `${Object.values(cells).reduce((s,c)=>s+(c.revisat?1:0),0)}/${manifest.cells.length} cel·les revisades · ${tot} topònims`;
}

function buildGrid() {
  const g = $('grid'); g.innerHTML = '';
  for (const c of manifest.cells) {
    const d = document.createElement('div');
    const st = cells[c.id];
    d.className = 'cell ' + (!st || st.n === 0 ? 'empty' : st.revisat ? 'rev' : 'has');
    if (cur === c.id) d.classList.add('cur');
    d.textContent = st && st.n ? st.n : '·';
    d.title = c.id + (st ? ` — ${st.n} topònims${st.revisat?' (revisada)':''}` : '');
    d.onclick = () => loadCell(c.id);
    g.appendChild(d);
  }
}

async function loadCell(id) {
  cur = id;
  data = await (await fetch('/api/cell/' + id)).json();
  if (!Array.isArray(data.toponims)) data.toponims = [];
  sel = -1; addMode = false; $('addbtn').classList.remove('on'); $('wrap').classList.remove('add');
  $('cellid').textContent = id;
  $('tile').src = '/sub/' + id + '.jpg';
  $('edit').classList.remove('show');
  $('msg').textContent = '';
  render();
  buildGrid();
}

function render() {
  document.querySelectorAll('.mk').forEach(e => e.remove());
  const wrap = $('wrap');
  data.toponims.forEach((t, i) => {
    const m = document.createElement('div');
    m.className = 'mk ' + (t.dubte ? '' : 'segur') + (i === sel ? ' sel' : '');
    m.style.left = (t.fx * 100) + '%';
    m.style.top = (t.fy * 100) + '%';
    m.title = t.nom;
    m.onpointerdown = (e) => startDrag(e, i, m);
    wrap.appendChild(m);
  });
}

function selectTop(i) {
  sel = i; render();
  const t = data.toponims[i];
  $('f_nom').value = t.nom || ''; $('f_graf').value = t.graf || '';
  $('f_tipus').value = t.tipus || 'possessió'; $('f_dubte').checked = !!t.dubte;
  $('edit').classList.add('show');
}

let drag = null;
function startDrag(e, i, m) {
  e.preventDefault(); selectTop(i);
  drag = { i, moved: false };
  m.setPointerCapture(e.pointerId);
}
$('wrap').addEventListener('pointermove', (e) => {
  if (!drag) return;
  const r = $('tile').getBoundingClientRect();
  const fx = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  const fy = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
  data.toponims[drag.i].fx = fx; data.toponims[drag.i].fy = fy; drag.moved = true; render();
});
window.addEventListener('pointerup', () => { drag = null; });

$('wrap').addEventListener('click', (e) => {
  if (!addMode) return;
  const r = $('tile').getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  if (fx < 0 || fy < 0 || fx > 1 || fy > 1) return;
  data.toponims.push({ nom: '', graf: '', tipus: 'possessió', dubte: true, fx, fy });
  selectTop(data.toponims.length - 1);
});

$('f_nom').oninput = (e) => { if (sel >= 0) data.toponims[sel].nom = e.target.value; };
$('f_graf').oninput = (e) => { if (sel >= 0) data.toponims[sel].graf = e.target.value; };
$('f_tipus').onchange = (e) => { if (sel >= 0) data.toponims[sel].tipus = e.target.value; };
$('f_dubte').onchange = (e) => { if (sel >= 0) { data.toponims[sel].dubte = e.target.checked; render(); } };
$('f_del').onclick = () => { if (sel >= 0) { data.toponims.splice(sel, 1); sel = -1; $('edit').classList.remove('show'); render(); } };

$('addbtn').onclick = () => { addMode = !addMode; $('addbtn').classList.toggle('on', addMode); $('wrap').classList.toggle('add', addMode); };

$('save').onclick = async () => {
  const r = await fetch('/api/cell/' + cur, { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ toponims: data.toponims, revisat: true }) });
  const j = await r.json();
  $('msg').textContent = j.ok ? `✓ desat (${j.saved})` : 'error';
  await refreshProgress(); buildGrid();
};

function step(d) {
  const idx = manifest.cells.findIndex(c => c.id === cur);
  const n = manifest.cells[(idx + d + manifest.cells.length) % manifest.cells.length];
  loadCell(n.id);
}
$('prev').onclick = () => step(-1);
$('next').onclick = () => step(1);
window.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight') step(1);
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'a') $('addbtn').click();
  if (e.key === 's') $('save').click();
});

init();
</script>
</body>
</html>
