# Cloudflare Workers (Static Assets) — serves the prebuilt Astro site in dist/.
# Assets-only Worker (no server code), so it sits alongside the other *-balears
# Workers at https://mapa-despuig.cloudflare-d82.workers.dev.
# Deploy: npm run deploy  (= astro build + wrangler deploy).
name = "mapa-despuig"
compatibility_date = "2025-01-01"
workers_dev = false

[assets]
directory = "./dist"
